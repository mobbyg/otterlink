<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Otter Link Search</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #10264c;
      --deep: #091a37;
      --blue: #2878c8;
      --gold: #ffd66b;
      --text: #edf4ff;
      --muted: #b8c8e2;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at top, #183d70 0%, var(--navy) 45%, var(--deep) 100%);
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .brand {
      color: var(--gold);
      text-transform: uppercase;
      font-size: .78rem;
      letter-spacing: .24em;
      font-weight: bold;
      margin-bottom: 18px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.1;
      margin: 0;
      text-align: center;
      text-shadow: 0 3px 14px #0008;
    }
    .subtitle {
      max-width: 560px;
      margin: 16px 0 30px;
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }
    .search-shell {
      display: flex;
      width: min(620px, 100%);
      padding: 7px;
      border: 1px solid #7294c4;
      border-radius: 12px;
      background: #07152c;
      box-shadow: 0 12px 34px #0005;
    }
    input {
      width: 100%;
      min-width: 0;
      padding: 15px 16px;
      border: 0;
      outline: 0;
      border-radius: 7px;
      color: var(--gold);
      background: #0b1d3b;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: .12em;
      cursor: default;
    }
    .note {
      margin-top: 18px;
      color: #92acd0;
      font-size: .85rem;
      text-align: center;
    }
    .rule {
      width: 90px;
      height: 3px;
      margin-top: 32px;
      border-radius: 9px;
      background: var(--gold);
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Otter Link · Internal Search</div>
    <h1>Find your way around.</h1>
    <p class="subtitle">A starting point for discovering the people, places, and pages of the Otter Link community.</p>
    <div class="search-shell">
      <input type="text" value="COMING SOON" aria-label="Otter Link Search coming soon" readonly tabindex="-1">
    </div>
    <p class="note">Otter Link Search is still swimming into view.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
